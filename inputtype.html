<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>all input types</title>
    </head>
    <style>
        .heading{
            color: blue;
        }
    </style>
    <body>
        <fieldset>
            <legend><b class="he">student form</b></legend>
            <form>
                <center>
                <h4 class="heading">fill the all student details</h4>
                <label for="name">FULLNAME</label>
                <input type="text" id="name" placeholder="name"><br><br>

                <label for="email">EMAIL</label>
                <input type="email" id="email" placeholder="email"><br><br> 

                <label>PASSWORD</label>
                <input type="password" id="password" placeholder="PASSWORD"><br><br>

                <label>CONFIRM PASSWORD</label>
                <input type="password" id="password" placeholder="CONFIRM PASSWORD"><br><br>

                <label for="phone">PHONE</label>
                <input type="tel" id="phone" placeholder="phone"><br><br>

                <label for="DOB">DOB</label>
                <input type="date" id="DOB" placeholder="dob"><br><br>

                <label>gender</label>
                <input type="radio" id="male" name="gender">male
                <input type="radio" id="female" name="gender">female<br><br>

                <label>COURSE</label>
                <input type="checkbox" id="course" name="course">cse
                <input type="checkbox" id="course" name="course">ece<br><br>

                <label>SKILL</label>
                <input type="checkbox" id="course" name="course">HTML
                <input type="checkbox" id="course" name="course">PYTHON
                <input type="checkbox" id="course" name="course">SQL<br><br>

                <label for="file-upload">file</label>
                <input type="file" id="file-upload"><br><br>

                <label for="address">address</label>
                <textarea id="address" placeholder="address"></textarea><br><br>

                <label for="city">city</label>
                <select name="city" name="city">
                    <option value="">select</option>
                    <option value="mumbai">mumbai</option>
                    <option value="hyderabad">hyderabad</option>
                    <option value="bangolore">bangoloare</option><br><br>
                </select><br><br>

                <button input type="button">
                    login
                </button>
                <button input type="button" >
                    submit
                </button>
                </center>
            </form>
        </fieldset>
        <script>
            
        </script>
    </body>
</html>
